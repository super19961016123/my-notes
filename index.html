<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的笔记 · 个人知识库</title>
<meta name="description" content="个人笔记网站：分类整理、全文搜索、全端阅读。由豆包维护，托管于 GitHub Pages。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='3' width='16' height='18' rx='2' fill='%232f6b5a'/%3E%3Cpath d='M9 3v18' stroke='%23fffefb' stroke-width='1.5'/%3E%3Cpath d='M12 7h4M12 10.5h4M12 14h2.5' stroke='%23fffefb' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f5f2ea;
  --surface:#fffefb;
  --surface-2:#efece2;
  --ink:#29241d;
  --ink-soft:#5a5344;
  --muted:#8d8578;
  --line:#e3ddd0;
  --accent:#2f6b5a;
  --accent-ink:#ffffff;
  --accent-soft:#e4efeb;
  --amber:#b0802c;
  --amber-soft:#f3ead7;
  --danger:#b3432f;
  --danger-soft:#fbf1ee;
  --shadow:0 1px 2px rgba(41,36,29,.05),0 8px 24px rgba(41,36,29,.06);
  --shadow-lift:0 4px 10px rgba(41,36,29,.08),0 18px 44px rgba(41,36,29,.12);
  --font-display:"Noto Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;
  --topbar-h:60px;
}
[data-theme="dark"]{
  --bg:#17140f;
  --surface:#201c16;
  --surface-2:#2a251d;
  --ink:#ece4d5;
  --ink-soft:#c5bba6;
  --muted:#938a79;
  --line:#39332a;
  --accent:#82b5a3;
  --accent-ink:#10241d;
  --accent-soft:#22332b;
  --amber:#d3a14f;
  --amber-soft:#3a3020;
  --danger:#e07a64;
  --danger-soft:#3a221d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lift:0 4px 10px rgba(0,0,0,.4),0 18px 44px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  line-height:1.7;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--amber-soft);color:var(--ink)}

/* ============ 顶栏 ============ */
.topbar{
  position:sticky;top:0;z-index:40;
  height:var(--topbar-h);
  display:flex;align-items:center;gap:12px;
  padding:0 16px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{width:28px;height:28px;flex:none}
.brand-text{
  font-family:var(--font-display);
  font-weight:700;font-size:17px;letter-spacing:.02em;
}
.brand-sub{color:var(--muted);font-size:12px;font-weight:400;font-family:var(--font-body);margin-left:2px}
.searchbox{
  flex:1;max-width:520px;margin:0 auto;
  display:flex;align-items:center;gap:8px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 12px;
  transition:border-color .15s, box-shadow .15s;
}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox svg{width:16px;height:16px;color:var(--muted);flex:none}
.searchbox input{
  flex:1;border:none;outline:none;background:transparent;color:var(--ink);font-size:14px;
}
.searchbox input::placeholder{color:var(--muted)}
.icon-btn{
  width:38px;height:38px;border-radius:9px;
  display:grid;place-items:center;color:var(--ink-soft);
  transition:background .15s;
  flex:none;
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:19px;height:19px}
#menuBtn{display:none}
.icon-btn .ico-moon{display:none}
[data-theme="dark"] .icon-btn .ico-moon{display:block}
[data-theme="dark"] .icon-btn .ico-sun{display:none}
.primary-btn{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  background:var(--accent);color:var(--accent-ink);
  padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;
  transition:filter .15s;
}
.primary-btn:hover{filter:brightness(1.08)}
.primary-btn svg{width:16px;height:16px}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  padding:7px 13px;border-radius:9px;font-size:13px;font-weight:500;
  transition:background .15s;
}
.ghost-btn:hover{background:var(--surface-2)}
.ghost-btn svg{width:15px;height:15px}
.danger-btn{
  display:inline-flex;align-items:center;gap:6px;flex:none;
  color:var(--danger);background:var(--danger-soft);border:1px solid color-mix(in srgb, var(--danger) 30%, transparent);
  padding:7px 13px;border-radius:9px;font-size:13px;font-weight:500;
  transition:background .15s;
}
.danger-btn:hover{filter:brightness(.97)}
.danger-btn svg{width:15px;height:15px}

/* ============ 三栏骨架 ============ */
.app{
  display:grid;
  grid-template-columns:236px 322px minmax(0,1fr);
  gap:0;
  max-width:1480px;
  margin:0 auto;
  min-height:calc(100vh - var(--topbar-h));
}
/* 侧栏 */
.sidebar{
  border-right:1px solid var(--line);
  background:var(--surface);
  padding:18px 12px 16px;
  display:flex;flex-direction:column;gap:6px;
  height:calc(100vh - var(--topbar-h));
  position:sticky;top:var(--topbar-h);
  overflow-y:auto;
}
.side-label{
  font-size:11px;letter-spacing:.14em;color:var(--muted);
  padding:10px 10px 6px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.side-label .expand-all-btn{font-size:10.5px;letter-spacing:0;color:var(--muted);background:none;border:1px solid var(--line);cursor:pointer;padding:2px 7px;border-radius:5px;transition:all .12s;text-transform:none}
.side-label .expand-all-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-soft)}
.cat{
  display:flex;align-items:center;gap:9px;
  padding:9px 10px;border-radius:9px;
  color:var(--ink-soft);font-size:14px;font-weight:500;
  text-align:left;width:100%;
  transition:background .12s,color .12s;
}
.cat:hover{background:var(--surface-2)}
.cat.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cat .cat-ico{width:16px;height:16px;flex:none;opacity:.85}
.cat .cat-count{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:500}
.cat.active .cat-count{color:var(--accent)}
/* 分类树 */
.cat-row{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
/* 分类树（竖线树形） */
.tree-root{display:flex;flex-direction:column;gap:0}
.tree-node{display:flex;flex-direction:column}
.tree-children{
  margin-left:8px;padding-left:9px;
  border-left:1.5px solid var(--line);
  display:flex;flex-direction:column;gap:0;
}
.tree-toggle{
  width:15px;height:15px;flex:none;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--line);border-radius:3px;
  font-size:12px;font-weight:700;line-height:1;
  color:var(--ink-soft);background:var(--surface);
  cursor:pointer;transition:all .12s;
}
.tree-toggle:hover{border-color:var(--accent);color:var(--accent)}
.tree-toggle.empty{visibility:hidden}
.cat.tree-item{padding:1px 5px;gap:4px;font-size:12px;border-radius:5px;line-height:1.1;min-height:0;height:22px;box-sizing:border-box;display:flex;align-items:center}
.cat.tree-item.active{padding:1px 5px;height:22px}
.cat.tree-item .cat-ico{width:12px;height:12px;flex:none}
.cat.tree-item .cat-act{width:16px;height:16px;flex:none}
.cat.tree-item .cat-act svg{width:10px;height:10px}
.cat.tree-item .cat-count{font-size:10px}
.tree-toggle{width:12px;height:12px;font-size:10px;flex:none}
.tree-children{margin-left:5px;padding-left:7px}
.cat-actions{display:flex;gap:3px;flex:none;opacity:.6;transition:opacity .15s}
.cat:hover .cat-actions{opacity:1}
.cat-act{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted);cursor:pointer;flex:none;font-size:13px;transition:all .12s}
.cat-act:hover{background:var(--surface);color:var(--ink)}
.cat-act.del:hover{color:var(--danger);background:var(--danger-soft)}
.cat .cat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
/* 编辑器工具栏 */
.ed-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--line);border-bottom:none;border-radius:9px 9px 0 0;background:var(--surface-2)}
.ed-toolbar .tb-sep{width:1px;height:18px;background:var(--line);margin:0 3px;flex:none}
.ed-toolbar button{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;padding:0 6px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--ink-soft);cursor:pointer;font-size:13px;font-weight:600}
.ed-toolbar button:hover{background:var(--surface);border-color:var(--line)}
.ed-toolbar select{height:26px;padding:0 5px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:12px}
.ed-toolbar input[type=color]{width:26px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:transparent;cursor:pointer;flex:none}
#edContent{border-radius:0 0 9px 9px;border-top:none;min-height:200px}
.editable-content{
  min-height:200px;max-height:55vh;overflow-y:auto;
  padding:12px 14px;
  border:1px solid var(--line);border-top:none;
  border-radius:0 0 9px 9px;
  background:var(--surface);color:var(--ink);
  font-size:14px;line-height:1.8;outline:none;
}
.editable-content:focus{border-color:var(--accent)}
.editable-content:empty:before{content:attr(placeholder);color:var(--muted)}
.editable-content h2{font-size:18px;font-weight:700;margin:12px 0 6px}
.editable-content ul{padding-left:20px;margin:6px 0}
.editable-content blockquote{border-left:3px solid var(--accent);padding-left:12px;color:var(--ink-soft);margin:8px 0}
.editable-content .task-item,.note-body .task-item{display:block;margin:5px 0;line-height:1.8}
.editable-content .task-item .box,.note-body .task-item .box{display:inline-block;width:14px;height:14px;vertical-align:middle;margin-right:6px;border:1.5px solid var(--muted);border-radius:4px;cursor:pointer;transition:all .12s;user-select:none}
.editable-content .task-item.done,.note-body .task-item.done{color:var(--muted);text-decoration:line-through}
.editable-content .task-item.done .box,.note-body .task-item.done .box{background:var(--accent);border-color:var(--accent)}
.note-body .task-item .box:hover{border-color:var(--accent)}
.note-body img,.editable-content img{max-width:100%;height:auto;border-radius:6px;margin:6px 0;display:block}
.icon-picker{display:flex;flex-wrap:wrap;gap:6px}
.icon-picker button{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);cursor:pointer}
.icon-picker button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.icon-picker svg{width:18px;height:18px}
.sidebar-tools{
  margin-top:8px;padding:10px 6px 2px;
  border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.storage-info{
  padding:10px 14px 4px;
  border-top:1px solid var(--line);
  margin-top:4px;
}
.storage-bar{
  height:6px;background:var(--surface-2);
  border-radius:3px;overflow:hidden;margin-bottom:6px;
}
.storage-fill{
  height:100%;background:var(--primary);
  border-radius:3px;transition:width .3s;
}
.storage-fill.warning{background:#f59e0b}
.storage-fill.danger{background:#ef4444}
.storage-text{
  font-size:11px;color:var(--muted);text-align:center;
}
.tool-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;border-radius:9px;
  color:var(--ink-soft);font-size:13px;font-weight:500;text-align:left;
  transition:background .12s;
}
.tool-btn:hover{background:var(--surface-2);color:var(--accent)}
.tool-btn svg{width:15px;height:15px;flex:none;opacity:.85}
.sync-status{
  font-size:11.5px;padding:8px 10px;border-radius:8px;margin-bottom:2px;
  display:flex;align-items:center;gap:7px;line-height:1.5;
}
.sync-status .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sync-status.on{background:var(--accent-soft);color:var(--accent)}
.sync-status.on .dot{background:var(--accent)}
.sync-status.off{background:var(--surface-2);color:var(--muted)}
.sync-status.off .dot{background:var(--muted)}
.sync-status.error{background:var(--danger-soft);color:var(--danger)}
.sync-status.error .dot{background:var(--danger)}
.sync-status.loading{background:var(--amber-soft);color:var(--amber)}
.sync-status.loading .dot{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.8;background:var(--surface-2);border-radius:9px;padding:11px 14px}
.sync-desc b{color:var(--ink)}
.sync-desc code{font-family:ui-monospace,Consolas,monospace;color:var(--accent)}
.sync-owner{font-size:12px;color:var(--ink-soft)}
.sync-btns{display:flex;flex-wrap:wrap;gap:8px}
.sidebar-foot{
  margin-top:10px;padding:12px 10px 4px;
  border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted);line-height:1.6;
}

/* 列表栏 */
.listpane{
  border-right:1px solid var(--line);
  background:var(--bg);
  height:calc(100vh - var(--topbar-h));
  position:sticky;top:var(--topbar-h);
  display:flex;flex-direction:column;
}
.list-head{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:10px;
}
.list-title{font-family:var(--font-display);font-size:16px;font-weight:700}
.list-count{font-size:12px;color:var(--muted)}
.list-scroll{overflow-y:auto;flex:1;padding:10px 8px 20px}
.note-item{
  display:block;width:100%;text-align:left;
  padding:12px 12px;border-radius:10px;
  border:1px solid transparent;
  transition:background .12s,border-color .12s;
  cursor:pointer;
}
.note-item:hover{background:var(--surface);border-color:var(--line)}
.note-item.active{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.ni-title{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.45;text-wrap:pretty}
.ni-title.has-tasks{color:#d32f2f}
.note-title.has-tasks{color:#d32f2f}
/* 待办汇总 */
.task-summary-item{display:flex;align-items:flex-start;gap:10px;text-align:left}
.task-summary-box{display:inline-block;width:16px;height:16px;flex:none;margin-top:2px;border:1.5px solid var(--muted);border-radius:4px;cursor:pointer;transition:all .12s;user-select:none}
.task-summary-box:hover{border-color:var(--accent)}
.task-summary-body{flex:1;min-width:0}
.task-summary-text{font-size:14px;color:var(--ink);line-height:1.5;word-break:break-word}
.task-summary-source{font-size:11.5px;color:var(--muted);margin-top:3px}
.ni-excerpt{
  font-size:12.5px;color:var(--muted);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.ni-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ni-date{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.ni-date svg{width:12px;height:12px}
.ni-tags{display:inline-flex;gap:5px;flex-wrap:wrap}
.tag{
  font-size:10.5px;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:20px;font-weight:500;
}
.empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.8}

/* 内容栏 */
.contentpane{
  height:calc(100vh - var(--topbar-h));
  position:sticky;top:var(--topbar-h);
  overflow-y:auto;
  background:var(--bg);
}
.content-wrap{
  max-width:760px;margin:0 auto;
  padding:34px 40px 90px;
}
.back-btn{
  display:none;align-items:center;gap:6px;
  font-size:13px;color:var(--muted);padding:6px 10px;border-radius:8px;margin-bottom:8px;
}
.back-btn:hover{background:var(--surface-2);color:var(--ink)}
.back-btn svg{width:15px;height:15px}
.note-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.note-meta .cat-chip{
  font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);
  padding:3px 10px;border-radius:20px;
}
.note-meta .date-chip{
  font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;
}
.note-meta .date-chip svg{width:13px;height:13px}
.edit-note-btn{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:8px;padding:5px 11px;
  transition:color .12s,border-color .12s,background .12s;
}
.edit-note-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.edit-note-btn svg{width:14px;height:14px}
.move-btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;flex:none;transition:all .12s;margin-left:4px}
.move-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--ink-soft)}
.note-item[draggable="true"]{cursor:grab}
.note-item.dragging{opacity:.4}
.note-title{
  font-family:var(--font-display);
  font-size:clamp(22px,3vw,30px);
  font-weight:700;line-height:1.35;margin:0 0 14px;text-wrap:pretty;
}
.note-tags{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:26px}
.tag-btn{
  font-size:12px;color:var(--ink-soft);background:var(--surface-2);
  padding:3px 11px;border-radius:20px;transition:background .12s,color .12s;
}
.tag-btn:hover{background:var(--accent-soft);color:var(--accent)}
.note-body{
  border-top:1px solid var(--line);
  padding-top:24px;
  font-size:15.5px;color:var(--ink-soft);
  text-wrap:pretty;
}
.note-body h2,.note-body h3,.note-body h4{
  font-family:var(--font-display);color:var(--ink);line-height:1.4;text-wrap:pretty;
}
.note-body h2{font-size:20px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.note-body h3{font-size:17px;margin:24px 0 8px}
.note-body h4{font-size:15.5px;margin:20px 0 6px}
.note-body p{margin:0 0 14px}
.note-body ul,.note-body ol{margin:0 0 14px;padding-left:24px}
.note-body li{margin:4px 0}
.note-body code{
  font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace;
  font-size:.88em;background:var(--surface-2);color:var(--accent);
  padding:1.5px 6px;border-radius:5px;
}
.note-body pre{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin:0 0 16px;line-height:1.6;
}
.note-body pre code{background:transparent;color:var(--ink-soft);padding:0;font-size:13.5px}
.note-body blockquote{
  margin:0 0 16px;padding:10px 16px;
  border-left:3px solid var(--accent);

.note-body .tasks .box:hover{border-color:var(--accent)}

.note-edit-hint{

}

.note-view-empty{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--muted);text-align:center;padding:40px;
}
.note-view-empty svg{width:44px;height:44px;opacity:.5}

.modal-mask{

  padding:9px 12px;color:var(--ink);font-size:14px;outline:none;

.field input:focus,.field select:focus,.field textarea:focus{

.field textarea{resize:vertical;min-height:240px;line-height:1.7}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ed-hint{

function loadUserData(){
  try {

    if (raw){
      // 尝试解压（兼容旧的未压缩数据）
      var d = null;
      try {
        var decompressed = LZString.decompressFromUTF16(raw);
        if (decompressed) d = JSON.parse(decompressed);
      } catch(e){}
      if (!d) d = JSON.parse(raw);
      if (d && Array.isArray(d.categories)) return d;
    }
  } catch(e){}
  return null;
}
function cloneData(d){ return JSON.parse(JSON.stringify(d)); }
function normalizeData(d){
  if (!d || !Array.isArray(d.categories)) return d;
  d.categories.forEach(function(c){
    if (c.parent === undefined) c.parent = null;
    if (c.collapsed === undefined) c.collapsed = false;
    if (!c.icon) c.icon = 'folder';
    if (!Array.isArray(c.notes)) c.notes = [];
    c.notes.forEach(function(n){ if (n.format === undefined) n.format = 'md'; });
  });
  return d;
}

function updateStorageInfo(){
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    var used = raw ? new Blob([raw]).size : 0;
    var total = 5 * 1024 * 1024;
    var percent = Math.min(100, (used / total) * 100);
    var usedMB = (used / 1024 / 1024).toFixed(2);
    var savedText = '';
    if (raw){
      try {
        var decompressed = LZString.decompressFromUTF16(raw);
        if (decompressed){
          var originalSize = new Blob([decompressed]).size;
          var saved = originalSize - used;
          if (saved > 1024) savedText = '，省 ' + (saved / 1024).toFixed(1) + ' KB';
          else if (saved > 0) savedText = '，省 ' + saved + ' B';
        }
      } catch(e){}
    }
    var fill = document.getElementById('storageFill');
    var text = document.getElementById('storageText');
    if (fill){
      fill.style.width = percent + '%';
      fill.classList.remove('warning', 'danger');
      if (percent >= 90) fill.classList.add('danger');
      else if (percent >= 70) fill.classList.add('warning');
    }
    if (text) text.textContent = '已用 ' + usedMB + ' MB / 5 MB（已压缩' + savedText + '）';
  } catch(e){}
}
function persist(){
  try {
    var compressed = LZString.compressToUTF16(JSON.stringify(current));
    localStorage.setItem(STORAGE_KEY, compressed);
    updateStorageInfo();
    return true;
  } catch(e){
    if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || (e.message && e.message.indexOf('quota') >= 0)){
      showToast('保存失败：存储空间不足！请删除一些笔记后再试');
    } else {
      showToast('保存失败：浏览器存储不可用');
    }
    return false;
  }
}

/* ================= 工具函数 ================= */
function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inline(s){
  s = escapeHtml(s);
  s = s.replace(/\{c:(#[0-9a-fA-F]{3,6}|[a-zA-Z]+)\}([\s\S]*?)\{\/c\}/g, '<span style="color:$1">$2</span>');
  s = s.replace(/\{s:(\d+)\}([\s\S]*?)\{\/s\}/g, '<span style="font-size:$1px;line-height:1.6">$2</span>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function parseMarkdown(text){
  var lines = text.replace(/\r\n/g,'\n').split('\n');
  var html = '', i = 0, inCode = false, codeBuf = [], taskCounter = 0;
  while (i < lines.length){
    var line = lines[i];
    if (/^\s*```/.test(line)){
      if (inCode){ html += '<pre><code>' + codeBuf.join('\n') + '</code></pre>'; codeBuf = []; inCode = false; }
      else { inCode = true; }
      i++; continue;
    }
    if (inCode){ codeBuf.push(escapeHtml(line)); i++; continue; }
    var m = line.match(/^(#{1,4})\s+(.*)$/);
    if (m){ var lv = m[1].length + 1; html += '<h'+lv+'>' + inline(m[2]) + '</h'+lv+'>'; i++; continue; }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)){ html += '<hr>'; i++; continue; }
    if (/^\s*>\s?/.test(line)){
      var q = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      html += '<blockquote>' + parseMarkdown(q.join('\n')) + '</blockquote>'; continue;
    }
    if (/^\s*[-*]\s*\[( |x|X)\]\s*/.test(line)){
      var tasks = [];
      while (i < lines.length && /^\s*[-*]\s*\[( |x|X)\]\s*/.test(lines[i])){
        var tm = lines[i].match(/^\s*[-*]\s*\[( |x|X)\]\s*(.*)$/);
        tasks.push('<li class="' + (tm[1].toLowerCase() === 'x' ? 'done' : '') + '"><span class="box" data-task-index="' + taskCounter + '"></span>' + inline(tm[2]) + '</li>');
        taskCounter++;
        i++;
      }
      html += '<ul class="tasks">' + tasks.join('') + '</ul>'; continue;
    }
    if (/^\s*[-*]\s*/.test(line)){
      var items = [];
      while (i < lines.length && /^\s*[-*]\s*/.test(lines[i])){ items.push('<li>' + inline(lines[i].replace(/^\s*[-*]\s*/,'')) + '</li>'); i++; }
      html += '<ul>' + items.join('') + '</ul>'; continue;
    }
    if (/^\s*\d+[.)]\s+/.test(line)){
      var oitems = [];
      while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ oitems.push('<li>' + inline(lines[i].replace(/^\s*\d+[.)]\s+/,'')) + '</li>'); i++; }
      html += '<ol>' + oitems.join('') + '</ol>'; continue;
    }
    if (/^\s*$/.test(line)){ i++; continue; }
    var para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i])){ para.push(lines[i]); i++; }
    html += '<p>' + inline(para.join('\n')).replace(/\n/g,'<br>') + '</p>';
  }
  return html;
}
function stripMd(s){ return s.replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\{c:[^}]+\}|\{\/c\}|\{s:\d+\}|\{\/s\}/g,'').replace(/`/g,'').replace(/\*\*/g,'').replace(/\*/g,'').replace(/\[|\]|\(|\)/g,'').replace(/^\s*[-*>#\d.)]+/gm,'').replace(/\s+/g,' ').trim(); }
function hasUnfinishedTasks(note){
  if (!note || !note.content) return false;
  if (note.format === 'html'){
    try {
      var div = document.createElement('div');
      div.innerHTML = note.content;
      var items = div.querySelectorAll('.task-item');
      for (var i = 0; i < items.length; i++){

      }
      return false;
    } catch(e){
      var items = note.content.match(/class\s*=\s*"?task-item[^">]*"?/gi) || [];
      var done = note.content.match(/task-item[^">]*done/gi) || [];

    }

}
function getAllUnfinishedTasks(){
  var tasks = [];
  current.categories.forEach(function(cat){
    cat.notes.forEach(function(note){
      if (!note.content) return;
      if (note.format === 'html'){
        try {
          var div = document.createElement('div');
          div.innerHTML = note.content;
          var items = div.querySelectorAll('.task-item');
          for (var i = 0; i < items.length; i++){
            if (!items[i].classList.contains('done')){
              tasks.push({ noteId: note.id, noteTitle: note.title, taskIndex: i, taskText: items[i].textContent.trim() });
            }
          }
        } catch(e){}
      } else {
        var lines = note.content.split('\n');
        var idx = 0;
        for (var j = 0; j < lines.length; j++){
          var m = lines[j].match(/^\s*[-*]\s*\[( |x|X)\]\s*(.*)$/);
          if (m){
            if (m[1] === ' ') tasks.push({ noteId: note.id, noteTitle: note.title, taskIndex: idx, taskText: m[2].trim() });
            idx++;
          }
        }
      }

  return tasks;
}
function completeTask(noteId, taskIndex){
  var f = findNote(noteId);
  if (!f) return;
  var note = f.note;
  if (note.format === 'html'){
    try {
      var div = document.createElement('div');
      div.innerHTML = note.content;
      var items = div.querySelectorAll('.task-item');
      if (items[taskIndex]){ items[taskIndex].classList.add('done'); note.content = div.innerHTML; }
    } catch(e){}
  } else {
    var lines = note.content.split('\n');
    var idx = 0;
    for (var i = 0; i < lines.length; i++){
      var m = lines[i].match(/^(\s*[-*]\s*)\[( |x|X)\](\s*.*)$/);
      if (m){
        if (idx === taskIndex && m[2] === ' '){ lines[i] = m[1] + '[x]' + m[3]; break; }

      }
    }

  }

  for (var i=0;i<current.categories.length;i++){

      if (current.categories[i].notes[j].id===id) return { note: current.categories[i].notes[j], cat: current.categories[i] };
    }
  }
  return null;
}

/* ================= 分类树辅助 ================= */
function childrenOf(id){
  return current.categories.filter(function(c){ return c.parent === id; });
}
function descendantIds(id){
  var ids = [id], stack = [id];
  while (stack.length){
    var cur = stack.pop();
    childrenOf(cur).forEach(function(c){ ids.push(c.id); stack.push(c.id); });
  }
  return ids;
}
function catDepth(id){
  var d = 0, c = findCat(id);
  while (c && c.parent){ d++; c = findCat(c.parent); }
  return d;
}
function catNoteCount(id){
  var ids = descendantIds(id), n = 0;
  current.categories.forEach(function(c){ if (ids.indexOf(c.id) !== -1) n += c.notes.length; });
  return n;
}

/* ================= 笔记排序 ================= */
function reorderNotes(dragId, targetId){
  var dragInfo = findNote(dragId);
  var targetInfo = findNote(targetId);
  if (!dragInfo || !targetInfo) return;
  if (dragInfo.cat.id !== targetInfo.cat.id){
    dragInfo.cat.notes = dragInfo.cat.notes.filter(function(n){ return n.id !== dragId; });
    targetInfo.cat.notes.unshift(dragInfo.note);
  }
  var cat = targetInfo.cat;
  var fromIdx = cat.notes.findIndex(function(n){ return n.id === dragId; });
  var toIdx = cat.notes.findIndex(function(n){ return n.id === targetId; });
  if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return;
  var item = cat.notes.splice(fromIdx, 1)[0];
  cat.notes.splice(toIdx, 0, item);
  persist();
  renderList();
  maybePush();
  showToast('已调整顺序');
}
function moveNote(direction){
  if (!state.note) return;
  var f = findNote(state.note);
  if (!f) return;
  var idx = f.cat.notes.findIndex(function(n){ return n.id === state.note; });
  var newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= f.cat.notes.length){ showToast('已经到顶了'); return; }
  var item = f.cat.notes.splice(idx, 1)[0];
  f.cat.notes.splice(newIdx, 0, item);
  persist();
  renderList(); renderNote();
  maybePush();
  showToast(direction < 0 ? '已上移' : '已下移');
}
/* ================= 待办勾选 ================= */
function toggleTask(noteId, taskIndex){
  var f = findNote(noteId);
  if (!f) return;
  var lines = f.note.content.split('\n');
  var count = 0;
  for (var i = 0; i < lines.length; i++){
    var m = lines[i].match(/^(\s*[-*]\s*)\[( |x|X)\](\s*.*)$/);
    if (m){
      if (count === taskIndex){
        var checked = m[2].toLowerCase() === 'x';
        lines[i] = m[1] + '[' + (checked ? ' ' : 'x') + ']' + m[3];
        break;
      }
      count++;
    }
  }
  f.note.content = lines.join('\n');
  persist();
  renderNote();
  maybePush();
}

function execCmd(cmd, val){

function applyFontSize(size){
  var ed = document.getElementById('edContent');
  var sel = window.getSelection();
  var range = null;
  if (sel.rangeCount) range = sel.getRangeAt(0).cloneRange();
  ed.focus();
  if (range){ sel.removeAllRanges(); sel.addRange(range); }
  if (!sel.rangeCount) return;
  range = sel.getRangeAt(0);

  // 找到包含选区的字号span
  var container = range.commonAncestorContainer;
  if (container.nodeType === 3) container = container.parentNode;
  var fsSpan = container.closest ? container.closest('span[style*="font-size"]') : null;

  if (!size){
    // 默认：清除字号
    if (fsSpan){
      fsSpan.style.fontSize = '';
      fsSpan.style.lineHeight = '';
      if (!fsSpan.getAttribute('style')){
        var p = fsSpan.parentNode;
        while (fsSpan.firstChild) p.insertBefore(fsSpan.firstChild, fsSpan);
        p.removeChild(fsSpan);
      }
    }
    document.getElementById('edFontSize').value = '';
    return;
  }

  // 设置字号：如果已有字号span，直接修改；否则创建新span
  if (fsSpan && range.collapsed){
    fsSpan.style.fontSize = size + 'px';
    fsSpan.style.lineHeight = '1.6';
  } else if (fsSpan && !range.collapsed){
    // 选中了部分文字，用新span包裹
    var newSpan = document.createElement('span');
    newSpan.style.fontSize = size + 'px';
    newSpan.style.lineHeight = '1.6';
    try {
      newSpan.appendChild(range.extractContents());
      range.insertNode(newSpan);
      sel.removeAllRanges();
      var r = document.createRange();
      r.selectNodeContents(newSpan);
      sel.addRange(r);
    } catch(e){}
  } else {
    var spanNew = document.createElement('span');
    spanNew.style.fontSize = size + 'px';
    spanNew.style.lineHeight = '1.6';
    try {
      spanNew.appendChild(range.extractContents());
      range.insertNode(spanNew);
      sel.removeAllRanges();
      var r2 = document.createRange();
      r2.selectNodeContents(spanNew);
      sel.addRange(r2);
    } catch(e){}
  }
  document.getElementById('edFontSize').value = '';
}
function insertTaskItem(){
  var ed = document.getElementById('edContent');
  ed.focus();
  var sel = window.getSelection();
  if (!sel.rangeCount) return;
  var range = sel.getRangeAt(0);

  // 找到光标所在的块级元素（段落/div/li）
  var node = range.startContainer;
  if (node.nodeType === 3) node = node.parentNode;
  while (node && node !== ed && !/^(P|DIV|LI|H[1-6])$/i.test(node.tagName)) {
    node = node.parentNode;
  }

  if (!node || node === ed) {
    // 光标不在段落里，创建一个新待办段落
    var p = document.createElement('p');
    p.className = 'task-item';
    var box0 = document.createElement('span');
    box0.className = 'box';
    box0.contentEditable = 'false';
    p.appendChild(box0);
    p.appendChild(document.createTextNode('\u00A0'));
    range.insertNode(p);
    // 光标移到方框后面
    var r = document.createRange();
    r.setStart(p.lastChild, 1);
    r.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r);
    return;
  }

  // 已经是待办项 → 取消；不是 → 变成待办项
  if (node.classList.contains('task-item')) {
    node.classList.remove('task-item');
    var oldBox = node.querySelector(':scope > .box');
    if (oldBox) oldBox.remove();
  } else {
    node.classList.add('task-item');
    var box = document.createElement('span');
    box.className = 'box';
    box.contentEditable = 'false';
    node.insertBefore(box, node.firstChild);
  }
}

function closeEditor(){

}
function saveNote(){
  var title = document.getElementById('edTitle').value.trim();
  var content = document.getElementById('edContent').innerHTML;
  var catId = document.getElementById('edCat').value;
  var tags = document.getElementById('edTags').value.split(/[,，]/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (!title){ showToast('请先填写标题'); return; }
  var cat = findCat(catId);
  if (!cat){ showToast('请先创建或选择一个分类'); return; }

  var savedId = editor.noteId;
  if (editor.mode === 'new'){
    var n = { id: genId('n'), title: title, date: todayLabel(), tags: tags, content: content, format: 'html' };
    cat.notes.unshift(n);
    savedId = n.id;
  } else {
    var f = findNote(editor.noteId);
    if (f){
      if (f.cat.id !== catId){
        f.cat.notes = f.cat.notes.filter(function(x){ return x.id !== editor.noteId; });
        cat.notes.unshift(f.note);
      }
      f.note.title = title;
      f.note.content = content;
      f.note.format = 'html';
      f.note.tags = tags;
    }
  }
  persist();
  closeEditor();
  state.note = savedId;
  var savedNote = findNote(savedId);
  if (savedNote) state.cat = savedNote.cat.id;
  state.query = ''; state.tag = null;
  document.getElementById('searchInput').value = '';
  renderSidebar(); renderList(); renderNote();
  document.body.classList.add('reading');
  document.getElementById('contentpane').scrollTop = 0;
  updateHash();
  showToast(editor.mode === 'new' ? '已保存到本设备' : '修改已保存');
  maybePush();
}
function deleteNote(){
  if (!editor.noteId) return;
  if (!confirm('确定删除这篇笔记吗？删除后无法恢复。')) return;
  var f = findNote(editor.noteId);
  if (f){
    f.cat.notes = f.cat.notes.filter(function(n){ return n.id !== editor.noteId; });
    persist();
  }
  closeEditor();
  state.note = null; state.query = ''; state.tag = null;
  if (state.cat !== 'all' && f && f.cat.notes.length === 0){ state.cat = 'all'; }
  renderSidebar(); renderList(); renderNote(); updateHash();
  document.body.classList.remove('reading');
  showToast('笔记已删除');
  maybePush();
}

function deleteCategory(id){

  if (!c) return;
  var others = current.categories.filter(function(x){ return x.id !== id; });
  if (others.length === 0){ showToast('至少保留一个分类'); return; }
  var kidCount = childrenOf(id).length;
  var msg = '确定删除分类“' + c.name + '”？';
  if (kidCount > 0) msg += '\n其下 ' + kidCount + ' 个子分类将提升为顶级分类。';
  if (c.notes.length > 0) msg += '\n该分类下 ' + c.notes.length + ' 篇笔记将移到“' + others[0].name + '”。';
  if (!confirm(msg)) return;
  // 子分类提升为顶级
  current.categories.forEach(function(x){ if (x.parent === id) x.parent = null; });
  // 笔记移到第一个其他分类
  c.notes.forEach(function(n){ others[0].notes.unshift(n); });
  current.categories = others;
  if (state.cat === id || descendantIds(id).indexOf(state.cat) !== -1) state.cat = 'all';
  persist();
  renderSidebar(); renderList(); renderNote(); updateHash();
  showToast('已删除分类');
  maybePush();
}

  reader.onload = function(){
    try {
      var d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.categories)) throw new Error('bad');
      if (!confirm('导入将用备份内容覆盖当前设备上的全部笔记，确定继续吗？')) return;
      current = normalizeData(d);
      persist();
      state.cat = 'all'; state.note = null; state.query = ''; state.tag = null;
      document.getElementById('searchInput').value = '';

  };
  reader.readAsText(file);
}

/* ================= 云同步（GitHub 加密存储） ================= */
var SYNC_KEY = 'mynotes-sync-config-v1';
var DATA_PATH = 'notes-encrypted.json';
var sync = loadSyncConfig();
var syncStatus = 'off';
var lastSha = null;

function loadSyncConfig(){
  try { var raw = localStorage.getItem(SYNC_KEY); if (raw) return JSON.parse(raw); } catch(e){}
  return null;
}
function saveSyncConfig(cfg){
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(cfg)); } catch(e){}
}
function clearSyncConfig(){
  try { localStorage.removeItem(SYNC_KEY); } catch(e){}
}

/* 加密：PBKDF2 派生密钥 + AES-GCM */
function toB64(str){
  var bytes = new TextEncoder().encode(str), bin = '';
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function fromB64(b64){
  var bin = atob(b64), u = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}
function bufToB64(buf){
  var bytes = new Uint8Array(buf), bin = '';
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function b64ToU8(b64){
  var bin = atob(b64), u = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function deriveKey(password){
  var enc = new TextEncoder();
  var material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: enc.encode('mynotes-notes-salt-v1'), iterations: 150000, hash:'SHA-256' },
    material,
    { name:'AES-GCM', length:256 },
    false, ['encrypt','decrypt']
  );
}
async function encryptJson(obj, password){
  var key = await deriveKey(password);
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var data = await crypto.subtle.encrypt({ name:'AES-GCM', iv: iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v:1, iv: bufToB64(iv), data: bufToB64(data) });
}
async function decryptJson(payload, password){
  var p = JSON.parse(payload);
  var key = await deriveKey(password);
  var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: b64ToU8(p.iv) }, key, b64ToU8(p.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* GitHub Contents API */
async function ghApi(token, url, opts){
  var headers = { 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' };
  if (opts && opts.body) headers['Content-Type'] = 'application/json';
  return fetch('https://api.github.com'+url, Object.assign({ method:'GET' }, opts, { headers: Object.assign(headers, (opts&&opts.headers)||{}) }));
}
async function getGhOwner(token){
  var res = await ghApi(token, '/user');
  if (!res.ok) throw new Error('Token 无效或无权访问');
  return (await res.json()).login;
}
function syncRepo(){ return (sync && sync.repo) ? sync.repo : 'my-notes'; }
async function ensureOwner(){
  if (sync.owner) return sync.owner;
  var owner = await getGhOwner(sync.token);
  sync.owner = owner;
  saveSyncConfig(sync);
  return owner;
}
async function cloudPull(){
  var owner = await ensureOwner();
  var res = await ghApi(sync.token, '/repos/'+owner+'/'+syncRepo()+'/contents/'+DATA_PATH);
  if (res.status === 404) return { exists:false };
  if (!res.ok) throw new Error('云端读取失败');
  var j = await res.json();
  var data = await decryptJson(fromB64(j.content), sync.password);
  normalizeData(data);
  lastSha = j.sha;
  return { exists:true, data:data };
}
async function cloudPush(data){
  var owner = await ensureOwner();
  var encrypted = await encryptJson(data, sync.password);
  var payload = { message:'update notes '+new Date().toISOString(), content: toB64(encrypted) };
  if (lastSha){
    payload.sha = lastSha;
  } else {
    var res = await ghApi(sync.token, '/repos/'+owner+'/'+syncRepo()+'/contents/'+DATA_PATH);
    if (res.status === 200) payload.sha = (await res.json()).sha;
  }
  var putRes = await ghApi(sync.token, '/repos/'+owner+'/'+syncRepo()+'/contents/'+DATA_PATH, { method:'PUT', body: JSON.stringify(payload) });
  if (!putRes.ok) throw new Error('云端写入失败');
  lastSha = (await putRes.json()).content.sha;
  return true;
}

/* 同步状态 UI */
function setSyncStatus(state, text){
  var el = document.getElementById('syncStatus');
  var tx = document.getElementById('syncStatusText');
  if (!el || !tx) return;
  el.hidden = false;
  el.className = 'sync-status ' + state;
  tx.textContent = text;
  syncStatus = state;
}
function hideSyncStatus(){
  var el = document.getElementById('syncStatus');
  if (el) el.hidden = true;
}
async function maybePush(){
  if (!sync) return;
  try {
    await cloudPush(current);
    setSyncStatus('on', '已同步到云端');
  } catch(e){
    setSyncStatus('error', '云端同步失败');
  }
}
async function syncFromCloud(){
  if (!sync) return;
  setSyncStatus('loading', '正在从云端同步…');
  try {
    var r = await cloudPull();
    if (r.exists){
      current = r.data;
      persist();
      state.cat = 'all'; state.note = null; state.query = ''; state.tag = null;
      document.getElementById('searchInput').value = '';
      renderSidebar(); renderList(); renderNote(); updateHash();
      setSyncStatus('on', '已从云端获取最新笔记');
      showToast('已从云端同步');
    } else {
      setSyncStatus('on', '云端暂无数据，本地笔记会自动上传');
    }
  } catch(e){
    setSyncStatus('error', '云端连接失败，当前为本地模式');
    if (e && e.message && String(e.message).indexOf('解密') >= 0) showToast('密码错误，无法解密云端笔记');
  }
}

/* 云同步设置弹窗 */
function openSync(){
  document.getElementById('syncMask').hidden = false;
  renderSyncPanel();
}
function closeSync(){ document.getElementById('syncMask').hidden = true; }
function renderSyncPanel(){
  var setup = document.getElementById('syncSetup');
  var panel = document.getElementById('syncPanel');
  var saveBtn = document.getElementById('syncSave');
  if (sync){
    setup.hidden = true; panel.hidden = false; saveBtn.hidden = true;
    document.getElementById('syncInfo').innerHTML =
      '已连接：<b>' + escapeHtml(sync.owner || 'GitHub 账号') + '</b> / <b>' + escapeHtml(syncRepo()) + '</b> 仓库<br>笔记以加密形式存于 <code>' + DATA_PATH + '</code>，密码只有你知道。';
  } else {
    setup.hidden = false; panel.hidden = true; saveBtn.hidden = false;
  }
}
async function enableSync(){
  var token = document.getElementById('syncToken').value.trim();
  var password = document.getElementById('syncPassword').value;
  var repo = document.getElementById('syncRepo').value.trim() || 'my-notes';
  if (!token){ showToast('请填写 GitHub Token'); return; }
  if (!password){ showToast('请设置笔记密码'); return; }
  if (password.length < 4){ showToast('密码至少 4 位'); return; }
  setSyncStatus('loading', '正在连接 GitHub…');
  try {
    var owner = await getGhOwner(token);
    sync = { token: token, password: password, repo: repo, owner: owner };
    saveSyncConfig(sync);
    closeSync();
    renderSyncPanel();
    await syncFromCloud();
  } catch(e){
    setSyncStatus('error', '连接失败：' + (e && e.message ? e.message : '请检查 Token'));
  }
}
async function syncPullNow(){
  setSyncStatus('loading', '正在获取…');
  try {
    var r = await cloudPull();
    if (r.exists){
      current = r.data;
      persist();
      state.cat='all'; state.note=null; state.query=''; state.tag=null;
      document.getElementById('searchInput').value='';
      renderSidebar(); renderList(); renderNote(); updateHash();
      setSyncStatus('on', '已从云端获取最新笔记');
    } else {
      setSyncStatus('on', '云端暂无数据');
    }
  } catch(e){
    setSyncStatus('error', '获取失败');
  }
}
async function syncPushNow(){
  setSyncStatus('loading', '正在上传…');
  try {
    await cloudPush(current);
    setSyncStatus('on', '已上传到云端');
    showToast('已上传到云端');
  } catch(e){
    setSyncStatus('error', '上传失败');
  }
}
function disableSync(){
  if (!confirm('关闭云同步？本设备上的配置将被清除，本地已有笔记会保留。')) return;
  clearSyncConfig();
  sync = null;
  lastSha = null;
  closeSync();
  renderSyncPanel();
  hideSyncStatus();
  showToast('已关闭云同步');
}

/* ================= 事件绑定 ================= */
function bind(){
  var search = document.getElementById('searchInput');
  var timer = null;
  search.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      state.query = search.value.trim();
      if (state.query){ state.note = null; document.body.classList.remove('reading'); }
      renderList(); renderNote(); updateHash();
    }, 180);
  });

  document.getElementById('catNav').addEventListener('click', function(e){
    if (e.target.id === 'expandAllBtn'){ expandAll(); return; }
    var t = e.target.closest('[data-toggle]');
    if (t){ toggleCollapse(t.getAttribute('data-toggle')); return; }
    var r = e.target.closest('[data-rename]');
    if (r){ renameCategory(r.getAttribute('data-rename')); return; }
    var d = e.target.closest('[data-delcat]');
    if (d){ deleteCategory(d.getAttribute('data-delcat')); return; }
    var b = e.target.closest('.cat');
    if (b) openCategory(b.getAttribute('data-cat'));
  });

  document.getElementById('listScroll').addEventListener('click', function(e){
    // 待办汇总：点击方框勾选完成
    var box = e.target.closest('.task-summary-box');
    if (box){
      var item = box.closest('.task-summary-item');
      if (item){
        completeTask(item.getAttribute('data-note'), parseInt(item.getAttribute('data-task'), 10));
        renderList();
        renderSidebar();
      }
      e.preventDefault();
      return;
    }
    // 待办汇总：点击条目跳转到原笔记
    var sumItem = e.target.closest('.task-summary-item');
    if (sumItem){ openNote(sumItem.getAttribute('data-note')); return; }
    // 普通笔记
    var b = e.target.closest('.note-item');
    if (b) openNote(b.getAttribute('data-id'));
  });
  /* 笔记拖拽排序 */
  var dragNoteId = null;
  document.getElementById('listScroll').addEventListener('dragstart', function(e){
    var b = e.target.closest('.note-item');
    if (b){ dragNoteId = b.getAttribute('data-id'); b.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
  });
  document.getElementById('listScroll').addEventListener('dragend', function(e){
    var b = e.target.closest('.note-item');
    if (b) b.classList.remove('dragging');
    dragNoteId = null;
  });
  document.getElementById('listScroll').addEventListener('dragover', function(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  });
  document.getElementById('listScroll').addEventListener('drop', function(e){
    e.preventDefault();
    var target = e.target.closest('.note-item');
    if (!target || !dragNoteId || target.getAttribute('data-id') === dragNoteId){ return; }
    reorderNotes(dragNoteId, target.getAttribute('data-id'));
  });

  document.getElementById('contentWrap').addEventListener('click', function(e){
    var t = e.target.closest('.tag-btn');
    if (t){
      state.tag = t.getAttribute('data-tag');
      state.note = null; state.query = '';
      document.getElementById('searchInput').value = '';
      document.body.classList.remove('reading');
      renderSidebar(); renderList(); renderNote(); updateHash();
    }
  });

  document.getElementById('themeBtn').addEventListener('click', function(){
    var root = document.documentElement;
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('notes-theme', next); } catch(e){}
  });

  document.getElementById('menuBtn').addEventListener('click', function(){
    document.body.classList.toggle('drawer-open');
  });
  document.getElementById('scrim').addEventListener('click', function(){
    document.body.classList.remove('drawer-open');
  });

  /* 编辑 */
  document.getElementById('writeBtn').addEventListener('click', function(){ openEditor('new', null); });
  document.getElementById('edCancel').addEventListener('click', closeEditor);
  document.getElementById('edSave').addEventListener('click', saveNote);
  document.getElementById('edDelete').addEventListener('click', deleteNote);
  /* 编辑器点击外面不关闭，只能点X/取消 */
  /* 编辑器工具栏（富文本） */
  document.querySelectorAll('.ed-toolbar [data-cmd]').forEach(function(btn){
    btn.addEventListener('mousedown', function(e){ e.preventDefault(); });
    btn.addEventListener('click', function(){
      var cmd = this.getAttribute('data-cmd');
      if (cmd === 'bold') execCmd('bold');
      else if (cmd === 'italic') execCmd('italic');
      else if (cmd === 'h2') execCmd('formatBlock', 'h2');
      else if (cmd === 'list') execCmd('insertUnorderedList');
      else if (cmd === 'quote') execCmd('formatBlock', 'blockquote');
      else if (cmd === 'task') insertTaskItem();
    });
  });
  document.getElementById('edFontSize').addEventListener('change', function(){ applyFontSize(this.value); });
  document.getElementById('edFontColor').addEventListener('input', function(){
    document.getElementById('edContent').focus();
    document.execCommand('styleWithCSS', false, true);
    document.execCommand('foreColor', false, this.value);
  });
  document.getElementById('edClearFmt').addEventListener('mousedown', function(e){ e.preventDefault(); });
  document.getElementById('edClearFmt').addEventListener('click', function(){
    document.getElementById('edContent').focus();
    document.execCommand('removeFormat');
  });
  /* 编辑器内待办方框点击勾选 */
  document.getElementById('edContent').addEventListener('click', function(e){
    var box = e.target.closest('.task-item .box');
    if (box){
      var item = box.closest('.task-item');
      if (item) item.classList.toggle('done');
      e.preventDefault();
    }
  });

  /* 待办项里按回车创建新段落，避免拆分布局异常 */
  document.getElementById('edContent').addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var sel = window.getSelection();
      if (!sel.rangeCount) return;
      var node = sel.anchorNode;
      if (node && node.nodeType === 3) node = node.parentNode;
      var taskItem = node ? node.closest('.task-item') : null;
      if (taskItem){
        e.preventDefault();
        var p = document.createElement('p');
        p.innerHTML = '<br>';
        taskItem.parentNode.insertBefore(p, taskItem.nextSibling);
        var r = document.createRange();
        r.setStart(p, 0);
        r.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r);
      }
    }
  });

  /* 分类与备份 */
  document.getElementById('addCatBtn').addEventListener('click', addCategory);
  document.getElementById('newCatCancel').addEventListener('click', function(){ document.getElementById('catMask').hidden = true; });
  document.getElementById('newCatSave').addEventListener('click', saveNewCat);
  document.getElementById('catMask').addEventListener('click', function(e){ if (e.target === this) this.hidden = true; });
  document.getElementById('iconPicker').addEventListener('click', function(e){
    var b = e.target.closest('[data-icon]');
    if (b){ selectedIcon = b.getAttribute('data-icon'); renderIconPicker(); }
  });
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', function(){ document.getElementById('importFile').click(); });
  document.getElementById('importFile').addEventListener('change', function(){
    if (this.files && this.files[0]) importData(this.files[0]);
    this.value = '';
  });

  /* 云同步 */
  document.getElementById('syncBtn').addEventListener('click', openSync);
  document.getElementById('syncCancel').addEventListener('click', closeSync);
  document.getElementById('syncSave').addEventListener('click', enableSync);
  document.getElementById('syncPullBtn').addEventListener('click', syncPullNow);
  document.getElementById('syncPushBtn').addEventListener('click', syncPushNow);
  document.getElementById('syncOffBtn').addEventListener('click', disableSync);
  document.getElementById('syncMask').addEventListener('click', function(e){
    if (e.target === this) closeSync();
  });

  window.addEventListener('hashchange', handleHash);

  document.addEventListener('keydown', function(e){
    if (e.key === '/' && document.activeElement !== search && !document.getElementById('editorMask').hidden){
      e.preventDefault(); search.focus();
    }
    if (e.key === 'Escape'){
      if (!document.getElementById('editorMask').hidden){ closeEditor(); return; }
      document.body.classList.remove('drawer-open');
      if (window.innerWidth <= 720 && document.body.classList.contains('reading')) closeReading();
    }
  });
}

/* ================= 启动 ================= */
(function init(){
  document.getElementById('brandText').textContent = SITE_TITLE;
  document.title = SITE_TITLE + ' · ' + SITE_SUBTITLE;
  try {
    var saved = localStorage.getItem('notes-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch(e){}
  renderSidebar();
  updateStorageInfo();
  handleHash();
  bind();
  if (sync){
    syncFromCloud();
  }
})();
